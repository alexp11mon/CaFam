<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Confirma tu nuevo email</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f3f2fa;
      font-family:
        Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;
      color: #1d1b2e;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f3f2fa; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px"
          >
            <tr>
              <td style="padding: 0 8px 20px">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      width="40"
                      height="40"
                      style="
                        width: 40px;
                        height: 40px;
                        background: #6d5bf0;
                        border-radius: 12px;
                      "
                    >
                      <img
                        src="https://calendario-familia-five.vercel.app/icons/icon-192.png"
                        width="40"
                        height="40"
                        alt=""
                        style="
                          display: block;
                          width: 40px;
                          height: 40px;
                          border: 0;
                          border-radius: 12px;
                        "
                      />
                    </td>
                    <td
                      style="
                        padding-left: 12px;
                        font-weight: 700;
                        font-size: 20px;
                        letter-spacing: -0.3px;
                        color: #1d1b2e;
                      "
                    >
                      CaFam
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #ffffff;
                  border: 1px solid #e9e7f5;
                  border-radius: 20px;
                  padding: 32px;
                  box-shadow:
                    0 16px 36px -10px rgba(60, 40, 140, 0.28),
                    0 4px 12px rgba(60, 40, 140, 0.08);
                "
              >
                <h1
                  style="
                    font-size: 22px;
                    line-height: 1.3;
                    font-weight: 700;
                    letter-spacing: -0.3px;
                    margin: 0 0 12px;
                    color: #1d1b2e;
                  "
                >
                  Confirma tu nuevo email
                </h1>
                <p
                  style="
                    font-size: 15px;
                    line-height: 1.55;
                    margin: 0 0 12px;
                    color: #1d1b2e;
                  "
                >
                  Pulsa el botón para usar esta dirección en tu cuenta de CaFam:
                </p>
                <p style="font-size: 15px; line-height: 1.4; margin: 0 0 28px">
                  <span
                    style="
                      display: inline-block;
                      background: #f3f2fa;
                      border-radius: 8px;
                      padding: 8px 12px;
                      font-weight: 600;
                      color: #5442d6;
                      word-break: break-all;
                    "
                    >{{ .NewEmail }}</span
                  >
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      style="
                        border-radius: 12px;
                        background: #6d5bf0;
                        background-image: linear-gradient(
                          135deg,
                          #6d5bf0,
                          #4371d0
                        );
                      "
                    >
                      <a
                        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change"
                        style="
                          display: inline-block;
                          padding: 14px 28px;
                          font-weight: 600;
                          font-size: 15px;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 12px;
                        "
                      >
                        Confirmar nuevo email
                      </a>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    font-size: 13px;
                    line-height: 1.5;
                    color: #6f6c86;
                    margin: 28px 0 0;
                    padding-top: 20px;
                    border-top: 1px solid #e9e7f5;
                  "
                >
                  Si no has pedido este cambio, ignora este correo: tu email
                  seguirá siendo el mismo.
                </p>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  padding: 20px 8px 0;
                  font-size: 12px;
                  line-height: 1.5;
                  color: #6f6c86;
                "
              >
                CaFam · el calendario compartido de tu familia
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
